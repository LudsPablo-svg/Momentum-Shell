# Default palette and recovery bar for direct use from the repository. The
# installer links this path to the generated palette selected by Void Theme.
bar {
    id void-i3-fallback
    mode hide
    position top
    status_command i3status
    i3bar_command i3bar --transparency
    font pango:DejaVu Sans Mono 10
    padding 6px 0
    workspace_min_width 34
    tray_padding 6
    separator_symbol "  "
    colors {
        background #1B1B1BE8
        statusline #E0E0E0
        separator #A0A0A0
        focused_workspace #80B918 #80B918 #1B1B1B
        active_workspace #404040 #404040 #E0E0E0
        inactive_workspace #1B1B1B #1B1B1B #A0A0A0
        urgent_workspace #D9534F #D9534F #1B1B1B
        binding_mode #D9A441 #D9A441 #1B1B1B
    }
}

client.focused          #80B918 #252525 #E0E0E0 #80B918 #80B918
client.focused_inactive #404040 #252525 #A0A0A0 #404040 #404040
client.unfocused        #252525 #1B1B1B #A0A0A0 #252525 #252525
client.urgent           #D9534F #252525 #E0E0E0 #D9534F #D9534F
client.placeholder      #404040 #1B1B1B #A0A0A0 #404040 #404040
client.background       #1B1B1B
