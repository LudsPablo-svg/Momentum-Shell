general {
    colors = true
    interval = 5
    color_good = "#80B918"
    color_degraded = "#D9A441"
    color_bad = "#D9534F"
    color_separator = "#A0A0A0"
    separator = ""
}

order += "wireless _first_"
order += "ethernet _first_"
order += "load"
order += "memory"
order += "tztime local"

wireless _first_ {
    format_up = "WIFI %quality %essid"
    format_down = "WIFI off"
}

ethernet _first_ {
    format_up = "LAN %ip"
    format_down = "LAN off"
}

load {
    format = "CPU %1min"
}

memory {
    format = "MEM %used"
}

tztime local {
    format = "%a %d %b  %H:%M"
}
