# X11 compositor: subtle opacity plus dual Kawase blur for translucent surfaces.
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
unredir-if-possible = false;

shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.24;
shadow-exclude = [
    "class_g = 'i3bar'",
    "class_g = 'Dunst'"
];

fading = true;
fade-delta = 8;
fade-in-step = 0.06;
fade-out-step = 0.06;

active-opacity = 0.97;
inactive-opacity = 0.91;
frame-opacity = 0.92;
inactive-opacity-override = false;
opacity-rule = [
    "100:class_g = 'i3lock'",
    "93:class_g = 'Rofi'",
    "92:class_g = 'Dunst'"
];

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'i3lock'"
];
blur = {
    method = "dual_kawase";
    strength = 5;
};
